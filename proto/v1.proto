//
// Protobuf definitions for Starkom's AVM (Algebraic Virtual Machine).
//
// The AVM is a virtual machine that executes programs represented as PLONK
// circuits. It's the compilation target for the Starkom language.
//
// This package defines version 1 of the AVM, which is based on vanilla PLONK
// arithmetization (3 columns). Future versions may use different schemes.
//
// These protobuf messages can be used to serialize and deserialize circuits as
// well as witnesses.

syntax = "proto3";

package starkom.avm.v1;

import "version.proto";

// A scalar in the field used in the AVM.
message Scalar {
  // Bytes of the value, in little-endian order.
  //
  // The number of bytes must be exactly equal to the field size in bytes, eg.
  // 32 bytes for a 256-bit field.
  //
  // The bytes must represent the value in natural form, not Montgomery, even if
  // the field has an efficient implementation based on Montgomery form.
  bytes value = 1;
}

// A PLONK gate.
message Gate {
  Scalar ql = 1;
  Scalar qr = 2;
  Scalar qo = 3;
  Scalar qm = 4;
  Scalar qc = 5;
}

// A PLONK wire.
message Wire {
  enum Type {
    WIRE_TYPE_INVALID = 0;
    WIRE_TYPE_LHS = 1;
    WIRE_TYPE_RHS = 2;
    WIRE_TYPE_OUT = 3;
  }

  // Wire type, which determines which column of the gate it corresponds to.
  Type type = 1;

  // Index of the wire, which determines which gate it corresponds to.
  uint64 index = 2;
}

// A node of the circuit, which is a collection of wires that are connected
// together.
message Node {
  // The set of connected wires. There must be at least two wires and no
  // duplicates.
  repeated Wire wires = 1;
}

// A PLONK circuit.
//
// NOTE: the circuit must not include the three blinding rows required in PLONK.
// They'll be added automatically by the AVM loader when parsing a `Circuit`.
message Circuit {
  Version version = 1; // Required. Must be 1.0.0 for this version of the AVM.
  repeated Gate gates = 2;
  repeated Node nodes = 3;
}

// A witness for a PLONK circuit.
//
// NOTE: the witness must not include the three blinding rows required in PLONK.
// They'll be added automatically by the AVM loader when parsing a `Witness`.
message Witness {
  // Required. Must be 1.0.0 for this version of the AVM.
  Version version = 1;

  // A single row of the witness. Each row corresponds to a gate in the circuit.
  message Row {
    Scalar lhs = 1;
    Scalar rhs = 2;
    Scalar out = 3;
  }

  // Witness rows. The number of rows must match the number of gates in the
  // circuit.
  repeated Row rows = 2;
}
